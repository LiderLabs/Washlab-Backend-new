services:
  postgres:
    image: postgres:16-alpine
    container_name: washlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-washlab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-washlab_secret_pass}
      POSTGRES_DB: ${DB_NAME:-washlab_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-washlab_user} -d ${DB_NAME:-washlab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: washlab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
