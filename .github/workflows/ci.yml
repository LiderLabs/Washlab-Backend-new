name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: washlab_user
          POSTGRES_PASSWORD: washlab_secret_pass
          POSTGRES_DB: washlab_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U washlab_user -d washlab_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # NODE_ENV is required: without it the app refuses to start (no silent dev fallbacks).
      NODE_ENV: test
      # Dummy values for CI only. Nothing real belongs here.
      DATABASE_URL: postgresql://washlab_user:washlab_secret_pass@localhost:5432/washlab_db
      REDIS_URL: redis://localhost:6379
      CLERK_SECRET_KEY: sk_test_mock_not_real
      CLERK_PUBLISHABLE_KEY: pk_test_mock_not_real
      CLERK_WEBHOOK_SECRET: whsec_mock_not_real
      PAYSTACK_SECRET_KEY: sk_test_mock_paystack
      JWT_SECRET: ci_only_jwt_secret_not_real_0123456789abcdef
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply init SQL
        run: psql "$DATABASE_URL" -f infra/init-db.sql

      - name: Typecheck
        run: npm run typecheck

      # Fails if the Drizzle schema has changes that no migration covers (a column added in code but never migrated
      # passes typecheck and then breaks at runtime). generate prints "No schema changes" and writes nothing when clean.
      - name: Check migrations match the schema
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain db)" ]; then
            echo "::error::Schema changed without a migration. Run: npx drizzle-kit generate --name <what_changed> and commit db/migrations."
            git status --short db
            exit 1
          fi

      - name: Migrate database
        run: npm run db:migrate

      - name: Test
        run: npm test
